<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Dashboard - SB Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
        <link href="{{ url_for('static',filename='css/styles.css') }}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <!-- Navbar Brand-->
            <a class="navbar-brand fs-6 ps-3" href="/">Association Rules</a>
            <!-- Sidebar Toggle-->
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu mt-2">
                        <div class="nav">
                            <a class="nav-link" href="/">
                                <div class="sb-nav-link-icon"><i class="fas fa-table"></i></div>
                              Halaman Utama
                            </a>
                            <a class="nav-link" href="{{ url_for('proses_data') }}">
                                <div class="sb-nav-link-icon"><i class="fa fa-refresh"></i></div>
                              Proses Data
                            </a>
                            <a class="nav-link" href="{{ url_for('informasi_data') }}">
                              <div class="sb-nav-link-icon"><i class="fa fa-info"></i></div>
                              Informasi Data
                            </a>
                        </div>
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    {% include 'form.html' %}
                    {% if show_result %}
                        {% include 'result.html' %}
                    {% endif %}
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="d-flex align-items-center justify-content-between small">
                                <div class="text-muted">Analisis Association Rule pada Data Kecelakaan</div>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{{ url_for('static',filename='js/scripts.js') }}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js" crossorigin="anonymous"></script>
        <script src="{{ url_for('static',filename='js/datatables-simple-demo.js') }}"></script>
        <script>
            $(document).ready(function() {
                $('#uploadForm').submit(function(event) {
                    event.preventDefault();
                    var formData = new FormData(this);
                    $.ajax({
                        url: '/submit',
                        type: 'POST',
                        data: formData,
                        processData: false,
                        contentType: false,
                        success: function(response) {
                            $('#loading').hide();
                            $('body').html(response);
                        },
                        error: function(xhr, status, error) {
                            var errorMessage = xhr.status + ': ' + xhr.statusText
                            alert('Error - ' + errorMessage);
                            $('#loading').hide();
                            alert('An error occurred while processing the data.');
                        }
                    });
                });
            
                $('#deleteForm').submit(function(event) {
                    event.preventDefault();
                    $.ajax({
                        url: '/delete',
                        type: 'POST',
                        success: function(response) {
                            alert('All pickle files have been deleted.');
                        },
                        error: function(xhr, status, error) {
                            var errorMessage = xhr.status + ': ' + xhr.statusText
                            alert('Error - ' + errorMessage);
                        }
                    });
                });
            });
        </script>
  </body>
</html>
